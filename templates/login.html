<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Starlight</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon-512.png') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1a1a2e;
            display: flex;
            background: #ffffff;
        }

        /* 左半:图片播放区(由左往右循环移动) */
        .backdrop-panel {
            flex: 1 1 50%;
            position: relative;
            overflow: hidden;
            background: #0f0c29;
            min-height: 100vh;
        }
        .backdrop-panel img {
            position: absolute;
            top: 0; left: 0;
            width: 130%;
            height: 100%;
            object-fit: cover;
            /* 单图由左往右循环播放:图片比容器宽 30%,
               从右端对齐位置开始,整体向右移动到左端对齐,
               再跳回起点循环(全程覆盖不露白) */
            animation: slide-ltr 18s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes slide-ltr {
            from { transform: translateX(-23.08%); } /* 图片右缘与容器右缘对齐(偏左) */
            to   { transform: translateX(0); }        /* 图片左缘与容器左缘对齐(偏右) */
        }

        /* 右半:登录区 */
        .login-panel {
            flex: 1 1 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 24px;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            padding: 40px;
            width: 100%;
            max-width: 380px;
        }
        .login-card h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #7c5cf0;
        }
        .login-card .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 0.88rem;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e7eb; background: #ffffff; color: #1a1a2e;
            border-radius: 6px;
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        .form-group input:focus { border-color: #7c5cf0; }
        .btn-login {
            width: 100%;
            padding: 10px;
            background: #7c5cf0;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.92rem;
            font-weight: 500;
            margin-top: 4px;
            transition: background 0.15s;
        }
        .btn-login:hover { background: #6a48e0; }
        .error {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            text-align: center;
        }

        /* 窄屏:轮播区收起,只显示登录 */
        @media (max-width: 768px) {
            .backdrop-panel { display: none; }
            .login-panel { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    <div class="backdrop-panel" aria-hidden="true">
        <img src="{{ url_for('static', filename='img/backdrop.png') }}" alt="">
    </div>
    <div class="login-panel">
        <div class="login-card">
            <h1>Starlight</h1>
            <p class="subtitle">Please log in to continue</p>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" autocomplete="username" autofocus required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login">Log In</button>
            </form>
        </div>
    </div>
</body>
</html>
