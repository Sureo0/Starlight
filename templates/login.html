<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Starlight</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1a1a2e;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            padding: 40px;
            width: 100%;
            max-width: 380px;
        }
        .login-card h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #7c5cf0;
        }
        .login-card .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 0.88rem;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e7eb; background: #ffffff; color: #1a1a2e;
            border-radius: 6px;
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        .form-group input:focus { border-color: #7c5cf0; }
        .btn-login {
            width: 100%;
            padding: 10px;
            background: #7c5cf0;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.92rem;
            font-weight: 500;
            margin-top: 4px;
            transition: background 0.15s;
        }
        .btn-login:hover { background: #6a48e0; }
        .error {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>AI Chat</h1>
        <p class="subtitle">Please log in to continue</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" autocomplete="username" autofocus required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login">Log In</button>
        </form>
    </div>
</body>
</html>
